[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:migrate]
command=python manage.py migrate --noinput
directory=/app
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

[program:createdb]
command=python manage.py createdb
directory=/app
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

[program:django]
# WIKI-42: each replica needs more request handlers than the shared expensive-
# search cap.  With sync workers, excess connections waited in Gunicorn's
# socket backlog and never reached the Redis gate, so clients timed out instead
# of receiving the intended 429.  Gthread lets the cheap admission check run
# immediately while Redis still bounds the expensive FTS work cluster-wide.
command=gunicorn --bind 0.0.0.0:8013 --workers 2 --worker-class gthread --threads 4 --timeout 120 wikimanager.wsgi:application
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:celery-worker]
command=celery -A wikimanager worker -l info -Q shizuha_wiki --concurrency=2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:mcp-server]
command=python /app/mcp-server/wiki_server.py --http-port 18105
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_WIKI_URL="http://localhost:8013",SHIZUHA_MCP_OAUTH_ENFORCE="true"
priority=5

[program:celery-beat]
command=celery -A wikimanager beat -l info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
